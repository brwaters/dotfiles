# Disable systemd-sleep's default user.slice freeze for hibernate.
#
# Confirmed root cause (2026-08-13): with the freeze on, WirePlumber (which
# holds the T2 aaudio PCI device's ALSA control interface open, entirely
# normal) gets frozen via cgroup freezer at the same time our pre-hibernate
# hook (/usr/lib/systemd/system-sleep/apple-bce-reload) tries to unbind that
# same device. The kernel's PCI unbind then blocks waiting on a process that
# can't respond because it's paused -- a genuine deadlock. Hibernate never
# completes, whole system hangs, forces a hard reset. Confirmed via hook log:
# without this override the log stops dead after the very first line; with
# it, the full pre/post sequence completes and hibernate resumes cleanly
# (same boot ID preserved across the cycle).
#
# Checked systemd's own source (src/sleep/sleep.c) for what this disables:
# the two specific risks it calls out are suspend-then-hibernate operations
# and per-user encrypted-home-directory setups. Neither applies here -- this
# machine uses plain hibernate (not suspend-then-hibernate) and full-disk
# LUKS decrypted once at boot, not per-user encrypted homes.
[Service]
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=0
