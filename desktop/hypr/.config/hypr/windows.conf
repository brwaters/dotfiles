windowrule = workspace 10, match:class ^(discord)$
windowrule = no_initial_focus on, match:class ^(discord)$, match:workspace 10
windowrule = no_initial_focus on, match:class ^(firefox)$, match:workspace 9
windowrule = rounding 4, match:float 1
# Overrides ~/.local/share/omarchy/default/hypr/apps/steam.conf
# Steam uses XWayland so notifications were set by setting primary display for XWayland apps
# in autostart.conf
# The following rule instead handles a specific startup window when launching and logging into steam
windowrule = workspace 1, center on, match:class ^(steam)$, match:title ^(Sign in to Steam)$
windowrule = size 1800 1000, match:class steam, match:title Steam
# overrides Omarchy default floating window size to be larger to accomodate larger
# default font size 9->14 from ~/.local/share/omarchy/defualt/hypr/apps/steam.conf
# Overrides the default size by removing the floating window tag and strictly setting the size
# for my fast-fetch-tui, btop and satty (screenshot previewer)
windowrule = tag -floating-window, float on, size 1280 780, center on, match:class ^(org\.omarchy\.fastfetch-tui|org\.omarchy\.btop|com\.gabm\.satty)$

# enable VRR
misc {
    vrr = 2
  }
