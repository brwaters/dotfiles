# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # These values aren't respected by the `omarchy-hyprland-workspace-toggle-gaps` script
    # so it's pointless to set them here
    # gaps_in = 2
    # gaps_out = 4
    # border_size = 4


    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 0

    # Some themes (e.g. Event Horizon) set blur.ignore_opacity = true, which
    # renders blur as if opacity were always 1 regardless of the window's
    # actual alpha. That makes an opacity toggle only visibly affect the
    # border (not blurred) while the content (blurred) never appears to
    # change. Force blur to respect real opacity so toggling actually works.
    blur {
        ignore_opacity = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Omarchy's terminals.conf applies its own ambient opacity (0.985 active,
# 0.96 inactive) to terminal-tagged windows, separately from default-opacity.
# That keeps terminals from ever reaching true full opacity, including via
# the Super+Backspace toggle's "off" state. Force terminals fully opaque.
windowrule = opacity 1.0 1.0, match:tag terminal
