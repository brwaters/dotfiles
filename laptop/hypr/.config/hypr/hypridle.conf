general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver shortly before lock
# Note: if screensaver is enabled, it resets the idle timer, which delays the
# lock listener below by roughly its own timeout. screensaver-off is set on
# this machine, so omarchy-launch-screensaver exits immediately and the lock
# listener's timeout below is the real, undelayed lock time.
listener {
    timeout = 298
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 minutes
listener {
    timeout = 300
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}
